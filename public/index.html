<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WhiteCadae</title>
  <meta name="description" content="WhiteCadae : la plateforme d'interprétation des textes de White Cadae. Explorez les paroles, interprétez chaque passage, reliez les chansons entre elles.">
  <link rel="stylesheet" href="/styles.css">

  <!-- Onglet du navigateur : icônes rondes (coins transparents). -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">
  <!-- iOS applique son propre arrondi : l'image doit remplir tout le carré. -->
  <link rel="apple-touch-icon" href="/icons/icon-180.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WhiteCadae">

  <meta property="og:title" content="WhiteCadae">
  <meta property="og:description" content="Les textes de White Cadae, interprétés par sa communauté.">
  <meta property="og:image" content="/icons/social.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" data-link>
      <span class="brand-white">White</span><span class="brand-cadae">Cadae</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="nav"></nav>
  </header>

  <main id="app">
    <div class="loading">Chargement…</div>
  </main>

  <div id="install-banner" hidden>
    <img src="/icons/favicon-192.png" alt="" class="install-icon">
    <div class="install-text">
      <strong>Installer WhiteCadae</strong>
      <span id="install-hint">Ajoutez l’application à votre écran d’accueil.</span>
    </div>
    <button class="primary" id="install-go">Installer</button>
    <button class="link-btn" id="install-close" aria-label="Plus tard">✕</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
